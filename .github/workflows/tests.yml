name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --locked --group dev
      - run: uv run --no-sync pytest -q
      - run: uv run --no-sync ruff check src tests tools
      - run: node --check src/douyin_live_sense/static/app.js
      - run: node --check src/douyin_live_sense/static/login.js
      - run: bash -n scripts/setup.sh && bash -n scripts/run.sh
      - run: ./scripts/setup.sh --check
