[project]
name = "douyin-live-sense"
version = "0.1.0"
description = "本机抖音直播音频监听守卫"
requires-python = ">=3.11,<3.12"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.34,<1",
    "streamget==4.0.10",
]

[project.optional-dependencies]
analysis = [
    "pyannote.audio==4.0.7",
    "funasr==1.4.16",
    "torch==2.9.1",
    "torchaudio==2.9.1",
    "torchcodec==0.8.0",
    "huggingface-hub>=0.34,<1",
    "transformers>=4.48,<5",
]

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.25,<2", "httpx>=0.28,<1", "ruff>=0.11,<1"]

[project.scripts]
douyin-live-sense = "douyin_live_sense.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/douyin_live_sense"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
