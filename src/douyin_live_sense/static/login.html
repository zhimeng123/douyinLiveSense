<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light" />
    <title>登录 · ValuSense</title>
    <link rel="stylesheet" href="/style.css" />
    <script src="/login.js" defer></script>
  </head>
  <body class="login-page">
    <main class="login-shell">
      <section class="login-panel" aria-labelledby="login-heading">
        <div class="brand login-brand"><span class="brand-icon">◉</span> ValuSense</div>
        <p class="eyebrow">DOUYIN LIVE / LOCAL ACCESS</p>
        <h1 id="login-heading">登录管理台</h1>
        <p class="login-subtitle">请输入管理员密码继续。</p>
        <form id="login-form">
          <label for="login-password">管理员密码</label>
          <input id="login-password" name="password" type="password" autocomplete="current-password" required autofocus />
          <p id="login-error" class="notice" role="alert" hidden></p>
          <button id="login-submit" type="submit" class="primary">登录</button>
        </form>
      </section>
    </main>
  </body>
</html>
